<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholars Goal - O-Level</title>
<style>
body{font-family:Arial;margin:0;background:#f4f8ff;color:#222}
header{background:#0b3d91;color:#fff;padding:20px;text-align:center}
header h1{font-size:38px;margin:0}
.card{background:#fff;margin:12px;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;background:#0b3d91;color:#fff;font-size:16px}
button.green{background:#0a7a42} button.gray{background:#666}
.item{background:#eef3ff;padding:12px;margin:6px 0;border-radius:8px}
.note{background:#fffbe6;padding:12px;border-radius:8px}
</style></head><body>
<header><h1>🎓 SCHOLARS GOAL</h1><p>O-Level Summaries | NECTA Focus | Form 1-4</p></header>

<div id="pageSubjects" class="card"><h2>Choose Subject</h2>
<button onclick="chooseSubject('Biology')">🧬 Biology</button>
<button onclick="chooseSubject('Chemistry')">🧪 Chemistry</button>
<button onclick="chooseSubject('Physics')">⚡ Physics</button>
<button onclick="chooseSubject('Mathematics')">📐 Mathematics</button>
<button onclick="chooseSubject('English')">📖 English</button>
<button onclick="chooseSubject('Kiswahili')">📚 Kiswahili</button>
<button onclick="chooseSubject('Geography')">🌍 Geography</button>
<button onclick="chooseSubject('History')">🏛️ History</button>
<button onclick="chooseSubject('Civics')">⚖️ Civics</button>
</div>

<div id="pageForms" class="card" style="display:none"><button class="gray" onclick="backToSubjects()">← Subjects</button><h2 id="subjectTitle"></h2>
<button onclick="openForm(1)">Form 1</button><button onclick="openForm(2)">Form 2</button><button onclick="openForm(3)">Form 3</button><button onclick="openForm(4)">Form 4</button>
</div>

<div id="pageTopics" class="card" style="display:none"><button class="gray" onclick="backToForms()">← Back</button><h2 id="formTitle"></h2><div id="topicsList"></div></div>

<div id="pageNote" class="card" style="display:none"><button class="gray" onclick="backToTopics()">← Back to Topics</button><h2 id="noteTitle"></h2><div id="noteBody" class="note"></div><br><button class="green" onclick="sendWhatsApp()">Get Full PDF via WhatsApp</button></div>

<script>
let curSub='Biology',curForm=1,curTopic=0;
const bio={
"Form 1":[
{t:"1. Introduction to Biology",n:"<b>Biology = study of living things.</b><br>• Branches: Botany, Zoology, Microbiology, Ecology<br>• MRS GREN: Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition<br><b>NECTA Q:</b> Mention 4 characteristics of living things."},
{t:"2. Safety in Laboratory",n:"<b>Lab Rules:</b> No eating, No running, Wear lab coat, Tie hair.<br>• First Aid: Acid on skin - wash with plenty water. Cut - cover with clean cloth.<br>• Apparatus: Test tube, Beaker, Microscope, Bunsen burner.<br><b>NECTA Q:</b> State 4 lab safety rules."},
{t:"3. The Cell",n:"<b>Cell = basic unit of life.</b><br>• Parts: Nucleus (controls), Mitochondria (energy), Cytoplasm, Membrane, Vacuole, Chloroplast (plants)<br>• Plant has wall + chloroplast + big vacuole. Animal has small vacuole, no wall.<br>• Cell -> Tissue -> Organ -> System -> Organism<br><b>NECTA Q (2023):</b> State function of mitochondria."},
{t:"4. Classification",n:"<b>5 Kingdoms:</b> Monera, Protoctista, Fungi, Plantae, Animalia<br>• Binomial: Genus + species e.g. <i>Homo sapiens</i><br>• Ranks: Kingdom, Phylum, Class, Order, Family, Genus, Species<br><b>NECTA Q:</b> Write scientific name of human."}
],
"Form 2":[
{t:"1. Nutrition",n:"<b>Classes:</b> Carbohydrates, Proteins, Vitamins, Fats, Minerals, Water, Roughage<br>• Photosynthesis: CO2 + Water + Light -> Glucose + Oxygen. In chloroplast.<br>• Kwashiorkor (lack protein), Anaemia (lack iron), Rickets (lack Vit D)<br><b>NECTA Q:</b> Write equation for photosynthesis."},
{t:"2. Gaseous Exchange & Respiration",n:"<b>Respiration:</b> Glucose + Oxygen -> Energy + CO2 + Water<br>• Aerobic = with oxygen. Anaerobic = without oxygen.<br>• Organs: Lungs (human), Gills (fish), Stomata (plants), Skin (frog)<br><b>NECTA Q:</b> Differentiate aerobic and anaerobic."},
{t:"3. Movement",n:"<b>Plants:</b> Phototropism (to light), Geotropism (to gravity)<br>• Animals: Muscles + Skeleton. Biceps contracts, triceps relaxes.<br>• Joints: Hinge (knee), Ball & socket (shoulder)<br><b>NECTA Q:</b> Give 2 joints with examples."}
],
"Form 3":[
{t:"1. Nervous System",n:"<b>Neurone = nerve cell.</b> Dendrites, Axon, Cell body.<br>• CNS = Brain + Spinal cord.<br>• Reflex arc: Receptor -> Sensory -> CNS -> Motor -> Effector<br><b>NECTA Q:</b> Draw and label a neurone."},
{t:"2. Hormones",n:"<b>Glands:</b> Pituitary (master), Thyroid (thyroxine), Pancreas (insulin), Adrenal (adrenaline)<br>• Insulin controls sugar. Lack = Diabetes.<br><b>NECTA Q:</b> State function of insulin."},
{t:"3. Excretion",n:"<b>Excretion = removal of waste.</b><br>• Kidney = main organ. Nephron = unit.<br>• Waste: Urea, CO2, Salts, Water.<br><b>NECTA Q:</b> Name 3 excretory organs."},
{t:"4. Reproduction",n:"<b>Sexual:</b> Male + Female gametes fuse. <b>Asexual:</b> One parent.<br>• Human: Testis = sperms, Ovary = eggs. Fertilisation in fallopian tube.<br>• Plants: Pollination -> Fertilisation -> Seed.<br><b>NECTA Q:</b> Differentiate sexual and asexual."}
],
"Form 4":[
{t:"1. Genetics",n:"<b>Gene = part of DNA. Allele = form of gene.</b><br>• Dominant (T) hides recessive (t). Genotype = TT, Tt, tt.<br>• Cross Tt x Tt = 3 Tall : 1 Short<br>• XX = Female, XY = Male<br><b>NECTA Q:</b> Cross Tt x tt, give ratio."},
{t:"2. Evolution",n:"<b>Evolution = gradual change over time.</b><br>• Evidence: Fossils, Homologous structures, Embryos<br>• Darwin: Natural selection - survival of fittest.<br><b>NECTA Q:</b> State Darwin's theory."},
{t:"3. Ecology",n:"<b>Ecology = organisms + environment.</b><br>• Food chain: Producer -> Primary -> Secondary -> Tertiary<br>• Food web = many chains linked. Energy decreases upwards.<br>• Pollution: Air, Water, Soil.<br><b>NECTA Q:</b> Make food chain with 4 organisms."}
]
};
function chooseSubject(s){curSub=s;document.getElementById('pageSubjects').style.display='none';document.getElementById('pageForms').style.display='block';document.getElementById('subjectTitle').innerText=s;}
function backToSubjects(){document.getElementById('pageForms').style.display='none';document.getElementById('pageSubjects').style.display='block';}
function backToForms(){document.getElementById('pageTopics').style.display='none';document.getElementById('pageForms').style.display='block';}
function backToTopics(){document.getElementById('pageNote').style.display='none';document.getElementById('pageTopics').style.display='block';}
function openForm(f){curForm=f;document.getElementById('pageForms').style.display='none';document.getElementById('pageTopics').style.display='block';document.getElementById('formTitle').innerText=curSub+' Form '+f;let h='';if(curSub=='Biology'){let list=bio['Form '+f];list.forEach((t,i)=>{h+='<div class="item" onclick="openNote('+i+')">'+t.t+' →</div>'});}else{h='<div class="item">📚 '+curSub+' Form '+f+' notes - Coming Soon!<br><br>Tap below to order via WhatsApp.</div><button class="green" onclick="sendWhatsApp()">Order '+curSub+' Form '+f+' on WhatsApp</button>';}document.getElementById('topicsList').innerHTML=h;}
function openNote(i){curTopic=i;let t=bio['Form '+curForm][i];document.getElementById('pageTopics').style.display='none';document.getElementById('pageNote').style.display='block';document.getElementById('noteTitle').innerText=t.t;document.getElementById('noteBody').innerHTML=t.n;}
function sendWhatsApp(){let m="Hello Scholars Goal, I want "+curSub+" Form "+curForm+" Full PDF";window.open("https://wa.me/255000000000?text="+encodeURIComponent(m));}
</script></body></html>
